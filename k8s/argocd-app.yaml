apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xau-trading-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thaisonnguyen/exness-trading-platform
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: exness-trading
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
